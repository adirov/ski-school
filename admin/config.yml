- name: services
  label: Занятия
  label_singular: Занятие
  folder: content/services
  extension: json
  format: json
  create: true
  delete: false
  identifier_field: slug
  slug:
    template: '{{fields.slug}}'
    editable: false
  summary: '{{fields.title.ru}} · {{fields.status}}'
  sortable_fields:
  - order
  - title.ru
  view_groups:
    groups:
    - name: status
      label: Статус
      field: status
    default: status
  description: 'Индивидуальные уроки, группы, дети, фрирайд. Удаление отключено: чтобы убрать занятие, поставьте статус «В корзине».'
  fields:
  - name: title
    label: Название
    widget: object
    collapsed: false
    fields:
    - name: ru
      label: Русский
      widget: string
    - name: en
      label: English
      widget: string
      required: false
  - name: shortTitle
    label: Короткое название
    widget: object
    required: false
    collapsed: false
    fields:
    - name: ru
      label: Русский
      widget: string
      required: false
    - name: en
      label: English
      widget: string
      required: false
    hint: Для узких мест, например списка в форме заявки на телефоне.
  - name: slug
    label: Адрес страницы (URL)
    widget: string
    pattern:
    - ^[a-z0-9-]+$
    - Только латиница в нижнем регистре, цифры и дефисы
    hint: Часть адреса после /tours/ или /services/. Если меняете адрес опубликованной страницы, добавьте переадресацию в разделе «Переадресации».
  - name: status
    label: Статус публикации
    widget: select
    default: confirmed
    options:
    - label: Опубликовано
      value: confirmed
    - label: Пример (виден только на превью)
      value: demo
    - label: Снято с публикации
      value: hidden
    - label: В корзине
      value: trash
