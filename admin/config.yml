# Admin panel (Sveltia CMS) settings. Docs: docs/CMS.md. Field labels are what the owner sees.
backend:
  name: github
  repo: adirov/ski-school
  branch: main
  commit_messages:
    create: 'CMS: создано «{{slug}}» ({{collection}})'
    update: 'CMS: изменено «{{slug}}» ({{collection}})'
    delete: 'CMS: удалено «{{slug}}» ({{collection}})'
    uploadMedia: 'CMS: загружено фото {{path}}'
    deleteMedia: 'CMS: удалено фото {{path}}'
app_title: Almaty Snowboard — админка
site_url: https://snow-school.kz/ru/
media_folder: public/images
public_folder: /images
media_libraries:
  default:
    config:
      max_file_size: 15000000
      slugify_filename: true
      transformations:
        raster_image:
          format: webp
          quality: 85
          width: 2560
          height: 2560
i18n:
  structure: multiple_folders
  locales:
  - ru
  - en
  default_locale: ru
slug:
  encoding: ascii
  clean_accents: true
output:
  omit_empty_optional_fields: true
collections:
- name: articles
  label: Статьи
  label_singular: Статья
  folder: content/articles
  extension: md
  format: yaml-frontmatter
  create: true
  delete: false
  i18n:
    structure: multiple_folders
    locales:
    - ru
    - en
    default_locale: ru
    initial_locales:
    - ru
  slug:
    editable: true
    i18n: duplicate
  summary: '{{fields.title}} · {{fields.status}}'
  sortable_fields:
  - published
  - updated
  - title
  view_groups:
    groups:
    - name: status
      label: Статус
      field: status
    default: status
  description: 'Русская и английская версии — отдельные вкладки в редакторе. Удаление отключено: чтобы убрать статью, поставьте статус «В корзине».'
  fields:
  - name: title
    label: Заголовок
    widget: string
    i18n: true
  - name: status
    label: Статус
    widget: select
    i18n: true
    default: draft
    options:
    - label: Черновик
      value: draft
    - label: Опубликовано
      value: published
    - label: В корзине
      value: trash
    hint: Черновик и корзина на сайте не видны. Восстановить — вернуть «Опубликовано» или «Черновик».
  - name: seoTitle
    label: 'SEO: заголовок страницы (title)'
    widget: string
    required: false
    i18n: true
    hint: Необязательно. Если пусто, берётся заголовок статьи.
  - name: description
    label: 'SEO: описание для поисковиков (description)'
    widget: text
    i18n: true
    hint: До ~160 символов. Показывается в Google и Яндексе.
  - name: category
    label: Рубрика
    widget: select
    i18n: duplicate
    options:
    - label: Новичкам
      value: beginners
    - label: Подготовка и снаряжение
      value: preparation
    - label: Поездки и курорты
      value: travel
  - name: cover
    label: Обложка
    widget: image
    i18n: duplicate
    choose_url: false
  - name: answer
    label: Короткий ответ (2–4 предложения в начале статьи)
    widget: text
    i18n: true
  - name: body
    label: Текст статьи
    widget: richtext
    i18n: true
    hint: Заголовки «Заголовок 2» и «Заголовок 3» попадут в оглавление. Фото можно вставлять прямо в текст.
  - name: published
    label: Дата публикации
    widget: datetime
    i18n: duplicate
    time_format: false
    format: YYYY-MM-DD
    default: '{{now}}'
  - name: updated
    label: Дата обновления
    widget: datetime
    i18n: true
    time_format: false
    format: YYYY-MM-DD
    default: '{{now}}'
  - name: author
    label: Автор
    widget: string
    required: false
    i18n: true
    default: Редакция Almaty Snowboard
  - name: reviewer
    label: Эксперт-проверяющий
    widget: string
    required: false
    i18n: true
  - name: translationKey
    label: Ключ перевода (служебное)
    widget: string
    i18n: duplicate
    hint: Латиницей, одинаковый у русской и английской версии.
  - name: relatedServices
    label: Связанные занятия
    widget: relation
    required: false
    i18n: duplicate
    collection: services
    value_field: '{{slug}}'
    search_fields:
    - title.ru
    display_fields:
    - '{{title.ru}}'
    multiple: true
  - name: relatedTours
    label: Связанные туры
    widget: relation
    required: false
    i18n: duplicate
    collection: tours
    value_field: '{{slug}}'
    search_fields:
    - title.ru
    display_fields:
    - '{{title.ru}}'
    multiple: true
  - name: relatedArticles
    label: Связанные статьи
    widget: relation
    required: false
    i18n: duplicate
    collection: articles
    value_field: '{{slug}}'
    search_fields:
    - title
    display_fields:
    - '{{title}}'
    multiple: true
  - name: sources
    label: Источники
    widget: list
    required: false
    i18n: true
    collapsed: true
    summary: '{{fields.title}}'
    fields:
    - name: title
      label: Название
      widget: string
    - name: url
      label: Ссылка
      widget: string
      required: false
    - name: checked
      label: Дата проверки
      widget: datetime
      required: false
      time_format: false
      format: YYYY-MM-DD
  - name: todo
    label: Что доработать (заметки, на сайте не видны)
    widget: list
    required: false
    i18n: true
    field:
      name: item
      label: Пункт
      widget: string
      required: false
- name: tours
  label: Туры
  label_singular: Тур
  folder: content/tours
  extension: json
  format: json
  create: true
  delete: false
  identifier_field: slug
  slug:
    template: '{{fields.slug}}'
    editable: false
  summary: '{{fields.title.ru}} · {{fields.status}}'
  sortable_fields:
  - order
  - title.ru
  view_groups:
    groups:
    - name: status
      label: Статус
      field: status
    default: status
  description: 'Программы на день и больше. Удаление отключено: чтобы убрать тур, поставьте статус «В корзине».'
  fields:
  - name: title
    label: Название
    widget: object
    collapsed: false
    fields:
    - name: ru
      label: Русский
      widget: string
    - name: en
      label: English
      widget: string
      required: false
  - name: slug
    label: Адрес страницы (URL)
    widget: string
    pattern:
    - ^[a-z0-9-]+$
    - Только латиница в нижнем регистре, цифры и дефисы
    hint: Часть адреса после /tours/ или /services/. Если меняете адрес опубликованной страницы, добавьте переадресацию в разделе «Переадресации».
  - name: status
    label: Статус публикации
    widget: select
    default: demo
    options:
    - label: Опубликовано
      value: confirmed
    - label: Пример (виден только на превью)
      value: demo
    - label: Снято с публикации
      value: hidden
    - label: В корзине
      value: trash
    hint: «Снято с публикации» и «В корзине» убирают страницу с сайта. Чтобы восстановить, верните статус «Опубликовано».
  - name: order
    label: Порядок на сайте
    widget: number
    required: false
    value_type: int
    default: 100
    hint: Меньше — выше.
  - name: summary
    label: Краткое описание
    widget: object
    collapsed: false
    fields:
    - name: ru
      label: Русский
      widget: text
    - name: en
      label: English
      widget: text
      required: false
  - name: description
    label: Описание (абзацы)
    widget: object
    collapsed: false
    fields:
    - name: ru
      label: Русский
      widget: list
      field:
        name: item
        label: Абзац
        widget: text
    - name: en
      label: English
      widget: list
      required: false
      field:
        name: item
        label: Абзац
        widget: text
  - name: images
    label: Фото
    widget: list
    min: 1
    field:
      name: image
      label: Фото
      widget: image
      choose_url: false
    hint: Первое фото — главное.
  - name: location
    label: Место
    widget: object
    collapsed: false
    fields:
    - name: ru
      label: Русский
      widget: string
    - name: en
      label: English
      widget: string
      required: false
  - name: price
    label: Цена
    widget: object
    collapsed: false
    fields:
    - name: amount
      label: Сумма
      widget: number
      required: false
      value_type: int
      hint: Пусто — на сайте «по запросу».
    - name: currency
      label: Валюта
      widget: select
      required: false
      default: KZT
      options:
      - KZT
      - USD
      - EUR
      - RUB
    - name: unit
      label: За кого
      widget: select
      required: false
      options:
      - label: За человека
        value: person
      - label: За группу
        value: group
    - name: todo
      label: Что уточнить
      widget: string
      required: false
  - name: duration
    label: Длительность
    widget: object
    collapsed: true
    fields:
    - name: value
      label: Значение
      widget: object
      required: false
      collapsed: false
      fields:
      - name: ru
        label: Русский
        widget: string
        required: false
      - name: en
        label: English
        widget: string
        required: false
    - name: todo
      label: Что уточнить (заметка, на сайте не видна)
      widget: string
      required: false
    summary: '{{fields.todo}}'
    hint: 'Оставьте пустым, если пока неизвестно: на сайте будет «уточняйте по запросу».'
  - name: route
