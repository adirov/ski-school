- name: other
  label: Прочее
  files:
  - name: faq
    label: Частые вопросы
    file: content/faq.json
    format: json
    fields:
    - name: items
      label: Вопросы
      widget: list
      root: true
      summary: '{{fields.q.ru}}'
      fields:
      - name: q
        label: Вопрос
        widget: object
        collapsed: false
        fields:
        - name: ru
          label: Русский
          widget: string
        - name: en
          label: English
          widget: string
          required: false
      - name: a
        label: Ответ
        widget: object
        collapsed: false
        fields:
        - name: ru
          label: Русский
          widget: text
        - name: en
          label: English
          widget: text
          required: false
      - name: confirmed
        label: Подтверждено владельцем (показывать на сайте)
        widget: boolean
        default: false
      - name: todo
        label: Что уточнить
        widget: string
        required: false
  - name: redirects
    label: Переадресации
    file: content/redirects.json
    format: json
    fields:
    - name: items
      label: Переадресации
      widget: list
      required: false
      root: true
      hint: 'Если поменяли адрес страницы, добавьте строку: старый адрес → новый. Тогда старые ссылки и закладки продолжат работать.'
      summary: '{{fields.source}} → {{fields.destination}}'
      fields:
      - name: source
        label: Старый адрес
        widget: string
        pattern:
        - ^/(ru|en)/.*/$
        - Например /ru/tours/old-name/
      - name: destination
        label: Новый адрес
        widget: string
        pattern:
        - ^/(ru|en)/.*/$
        - Например /ru/tours/new-name/

